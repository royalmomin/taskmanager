<!-- ROYAL MANAGER: TaskList View -->
<div id="view-tasks" class="view-section">
  <div class="table-header">
    <h2>My Tasks</h2>
    <button class="btn btn-primary" onclick="document.getElementById('task-form-card').classList.toggle('hidden')">+ Add Task</button>
  </div>
  
  <div id="task-form-card" class="card hidden" style="margin-bottom: 20px;">
    <form onsubmit="event.preventDefault(); App.saveTaskForm();">
      <div class="form-row">
        <div class="form-group">
          <label>Task Name *</label>
          <input type="text" id="t-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" id="t-date" class="form-control" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Save Task</button>
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('task-form-card').classList.add('hidden')">Cancel</button>
    </form>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 40px;"></th>
          <th>Task Name</th>
          <th>Due Date</th>
          <th>Status</th>

        </tr>
      </thead>
      <tbody id="tasks-tbody">
        <!-- JS will populate -->
      </tbody>
    </table>
  </div>
</div>
